# Config baseline do Trivy (scan-type "config", cobre módulos e ambientes
# Terraform via .github/workflows/pr-validate.yml). Achados legítimos porém
# aceitos (ex.: egress 0.0.0.0/0 intencional no bastion/ALB) devem ser
# suprimidos via .trivyignore (raiz do repo) com justificativa durante a
# triagem pós-merge, não silenciados sem registro. `misconfiguration.skip-check`
# não é uma chave válida do schema do Trivy 0.70 (era ignorada silenciosamente
# sem suprimir nada) — o mecanismo real de supressão é o arquivo .trivyignore.
scan:
  scanners:
    - misconfig
