name: 'Validação de PR (Terraform)'

# Roda em todo PR contra main/develop. Não usa nenhum secret/credencial de
# nuvem (init com -backend=false), pois PRs em repositório público podem
# vir de forks.
on:
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  fmt:
    name: terraform-fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~1.12"
          terraform_wrapper: false

      - name: terraform fmt -check
        run: terraform fmt -check -recursive -diff

  validate:
    name: terraform-validate
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        path:
          - environments/aws/teste
          - environments/aws/homol
          - environments/aws/prod
          - environments/azure/teste
          - environments/azure/homol
          - environments/azure/prod
          - modules/aws/networking
          - modules/aws/security
          - modules/aws/data_storage
          - modules/aws/app_environment
          - modules/aws/bastion
          - modules/aws/load_balancer
          - modules/azure/networking
          - modules/azure/security
          - modules/azure/data_storage
          - modules/azure/app_environment
          - modules/azure/bastion
          - modules/azure/load_balancer
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~1.12"
          terraform_wrapper: false

      - name: terraform init (sem backend real)
        working-directory: ${{ matrix.path }}
        run: terraform init -backend=false

      - name: terraform validate
        working-directory: ${{ matrix.path }}
        run: terraform validate

  tflint:
    name: tflint
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        path:
          - modules/aws/networking
          - modules/aws/security
          - modules/aws/data_storage
          - modules/aws/app_environment
          - modules/aws/bastion
          - modules/aws/load_balancer
          - modules/azure/networking
          - modules/azure/security
          - modules/azure/data_storage
          - modules/azure/app_environment
          - modules/azure/bastion
          - modules/azure/load_balancer
    steps:
      - uses: actions/checkout@v4

      - uses: terraform-linters/setup-tflint@v4
        with:
          tflint_version: v0.63.1

      - name: tflint --init (instala plugins aws/azurerm do .tflint.hcl)
        run: tflint --init

      # Não-bloqueante por enquanto: findings pré-existentes nos 12 módulos
      # ainda não foram triados/suprimidos. Remover continue-on-error depois
      # da triagem, quando este job virar required status check.
      - name: tflint
        continue-on-error: true
        run: tflint --chdir="${{ matrix.path }}" --config="${{ github.workspace }}/.tflint.hcl"
