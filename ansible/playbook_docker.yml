---
- name: Preparar Servidores com Docker Engine e Docker Compose
  hosts: all
  become: true # Executar comandos como superusuário (sudo)
  tasks:
    - name: Atualizar cache de pacotes (apt)
      ansible.builtin.apt:
        update_cache: yes
        cache_valid_time: 3600

    - name: Instalar pacotes de pré-requisito
      ansible.builtin.apt:
        name: ['ca-certificates', 'curl', 'gnupg']
        state: present

    - name: Garantir que o diretório de keyrings existe
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        mode: '0755'

    - name: Baixar a chave GPG oficial do Docker
      ansible.builtin.get_url:
        url: https://download.docker.com/linux/ubuntu/gpg
        dest: /etc/apt/keyrings/docker.asc
        mode: '0644'

    - name: Adicionar o repositório do Docker
      ansible.builtin.apt_repository:
        repo: "deb [arch=amd64 signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable"
        state: present

    - name: Instalar Docker Engine, CLI, containerd e Docker Compose (v2)
      ansible.builtin.apt:
        name: ['docker-ce', 'docker-ce-cli', 'containerd.io', 'docker-compose-plugin']
        state: present
        update_cache: yes

    - name: Adicionar usuário 'ubuntu' ao grupo 'docker' para executar comandos sem sudo
      ansible.builtin.user:
        name: ubuntu
        groups: docker
        append: yes